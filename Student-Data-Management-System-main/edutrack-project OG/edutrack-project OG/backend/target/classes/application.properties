# =========================================
# EduTrack - application.properties
# =========================================

# Server port
server.port=8080

# MongoDB connection
# Default: connects to MongoDB running locally on port 27017
# Database name: edutrack
spring.data.mongodb.uri=mongodb://localhost:27017/edutrack

# Allow cross-origin requests from frontend (running on file:// or localhost)
# This is handled in CorsConfig.java, but just in case:
spring.web.cors.allowed-origins=*

# File upload limits (increase for large CSV files)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# App name
spring.application.name=edutrack-backend
